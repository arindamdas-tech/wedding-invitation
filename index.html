<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>অর্পিতা দাস ও সুমন্ত সাহা — শুভ বিবাহ</title>
<meta name="description" content="সপরিবারে সাদর আমন্ত্রণ — অর্পিতা দাস ও সুমন্ত সাহা" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Serif+Bengali:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --ivory: #fdf9f4;
    --blush: #f7eae4;
    --wine: #6e1f2f;
    --wine-dark: #4c121e;
    --gold: #c9a25e;
    --gold-light: #e7cfa0;
    --ink: #381820;
    --muted: #6f4c53;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; font-family: 'Montserrat', -apple-system, sans-serif; color: var(--ink); background: var(--ivory); }
  body {
    overflow-x: hidden;
    background:
      radial-gradient(ellipse 90% 50% at 50% 0%, #f9ede7 0%, transparent 70%),
      radial-gradient(ellipse 80% 60% at 15% 45%, #f5e5df 0%, transparent 65%),
      linear-gradient(180deg, #fdf9f5 0%, #f8ece6 52%, #fdf8f3 100%);
    min-height: 100svh;
  }
  .font-display { font-family: 'Playfair Display', 'Noto Serif Bengali', Georgia, serif; }
  .font-bengali { font-family: 'Noto Serif Bengali', 'Playfair Display', Georgia, serif; }
  .text-gold-foil {
    background: linear-gradient(135deg, #b88c42 0%, #e8d09f 38%, #c9a056 64%, #f0deb5 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .velvet-wine {
    background:
      radial-gradient(circle at 28% 22%, rgba(162,56,78,0.42) 0%, transparent 55%),
      radial-gradient(circle at 80% 82%, rgba(44,8,17,0.65) 0%, transparent 60%),
      linear-gradient(145deg, #7c2436 0%, #6e1f2f 45%, #4f1220 100%);
  }

  /* Opening 3D Velvet Book */
  #book-overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden;
    background: linear-gradient(180deg, #fbf1ec 0%, #f6e6df 55%, #efe0d8 100%);
    transition: opacity .55s ease;
  }
  #book-overlay.fade-out { opacity: 0; pointer-events: none; }
  .book-stage { perspective: 1450px; perspective-origin: 50% 48%; position: relative; z-index: 20; }
  .book-btn {
    position: relative; width: 262px; height: 374px; border: 0; background: transparent;
    cursor: pointer; transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(.22,1,.36,1);
    will-change: transform;
  }
  .book-btn.is-opening { transform: scale(1.62) translateX(12%) translateZ(90px); }
  .book-pages {
    position: absolute; inset: 0; border-radius: 4px 18px 18px 4px;
    background: linear-gradient(145deg, #fdf9f4, #f7e9e1);
    border: 1px solid rgba(214,182,125,.65);
    box-shadow: 0 28px 60px -14px rgba(76,18,30,.46);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
  }
  .book-cover {
    position: absolute; inset: 0; border-radius: 4px 18px 18px 4px;
    border: 1px solid rgba(201,162,94,.65); overflow: hidden;
    transform-origin: left center; transform-style: preserve-3d; backface-visibility: hidden;
    transition: transform 1.12s cubic-bezier(.32,.08,.18,1);
    box-shadow: inset 10px 0 24px rgba(28,5,10,.65), 0 20px 44px -12px rgba(76,18,30,.52);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 28px 18px 28px 26px; text-align: center;
  }
  .book-btn.is-opening .book-cover { transform: rotateY(-158deg); }
  .book-frame {
    position: absolute; inset: 14px 14px 14px 24px; border-radius: 2px 12px 12px 2px;
    border: 1px solid rgba(223,193,132,.75); pointer-events: none;
  }
  .book-rose-bg { position: absolute; pointer-events: none; width: 220px; opacity: .62; }
  .book-rose-fg { position: absolute; pointer-events: none; width: 190px; z-index: 30; opacity: .85; }
  .loader-track { width: 160px; height: 4px; border-radius: 99px; background: rgba(110,31,47,.15); overflow: hidden; }
  .loader-fill { height: 100%; width: 15%; background: linear-gradient(90deg, #6e1f2f, #c9a25e, #6e1f2f); transition: width .3s ease; }

  /* Fixed Marigolds & Corner Roses */
  #marigold-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 108px; pointer-events: none;
    z-index: 30; overflow: hidden; opacity: 0; transition: opacity .8s ease;
  }
  #marigold-bar.active, #corner-roses.active { opacity: 1; }
  .marigold-strand { position: absolute; top: 0; transform-origin: top center; will-change: transform; }
  #corner-roses {
    position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden;
    opacity: 0; transition: opacity 1s ease;
  }
  .corner-rose { position: absolute; width: 150px; will-change: transform; }
  @media (min-width: 640px) { .corner-rose { width: 200px; } }
  .corner-rose img { width: 100%; height: auto; display: block; }
  @keyframes swayL { 0%,100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(2.5deg) scale(1.03); } }
  @keyframes swayR { 0%,100% { transform: rotate(2deg) scale(1); } 50% { transform: rotate(-2.5deg) scale(1.03); } }
  .sway-l { animation: swayL 7.5s ease-in-out infinite; }
  .sway-r { animation: swayR 8.2s ease-in-out infinite; }

  #petal-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

  /* Main Continuous Page */
  main { position: relative; z-index: 10; max-width: 520px; margin: 0 auto; }

  /* Hero Section — exact single screen */
  #hero {
    height: 100svh; min-height: 580px; display: flex; align-items: center; justify-content: center;
    padding: 56px 20px 24px; overflow: hidden;
  }
  .arch-card {
    position: relative; width: 100%; max-width: 368px; height: min(82svh, 640px);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center; padding: 26px 24px;
  }
  .arch-bg {
    position: absolute; inset: 0; border-radius: 190px 190px 28px 28px;
    border: 1px solid rgba(201,162,94,.8); overflow: hidden; background: #fdf7f2;
    box-shadow: 0 24px 60px -28px rgba(110,31,47,.22);
  }
  .arch-bg img {
    width: 100%; height: 100%; object-fit: cover; opacity: .55;
    animation: archZoom 18s ease-in-out infinite; will-change: transform;
  }
  @keyframes archZoom { 0%,100% { transform: scale(1.02); } 50% { transform: scale(1.11) translateY(-1.5%); } }
  .arch-wash {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(253,249,244,.78) 0%, rgba(253,248,243,.72) 55%, rgba(248,236,230,.88) 100%);
  }
  .arch-inner {
    position: absolute; inset: 10px; border-radius: 180px 180px 20px 20px;
    border: 1px solid rgba(201,162,94,.4); pointer-events: none;
  }
  .letter-in { opacity: 0; display: inline-block; animation: letterIn .55s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes letterIn { from { opacity: 0; transform: translate3d(0,8px,0) scale(.94); } to { opacity: 1; transform: translate3d(0,0,0) scale(1); } }
  @keyframes floatY { 0%,100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(7px); opacity: 1; } }
  .float-arrow { animation: floatY 2.2s ease-in-out infinite; }

  /* Sections */
  section { padding: 64px 20px; text-align: center; }
  .kicker { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #916938; font-weight: 500; }
  .sec-title { margin-top: 6px; font-size: 30px; color: var(--wine); font-weight: 500; }
  .reveal { opacity: 0; transform: translate3d(0,18px,0); transition: opacity .8s ease, transform .8s ease; }
  .reveal.vis { opacity: 1; transform: translate3d(0,0,0); }
  .anim-paused, .anim-paused * { animation-play-state: paused !important; }

  /* Save the Date Scroll */
  .scroll-wrap { width: 100%; max-width: 340px; margin: 30px auto 0; display: flex; flex-direction: column; align-items: center; user-select: none; }
  .rod { width: 100%; display: flex; align-items: center; z-index: 2; }
  .rod-ball { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #f6e3b3, #c9a25e 55%, #7d5a24); }
  .rod-bar { flex: 1; height: 12px; background: linear-gradient(180deg, #f3dfb0, #c9a25e 50%, #876227); box-shadow: 0 4px 10px rgba(76,18,30,.22); }
  .parchment {
    width: 88%; height: 28px; overflow: hidden; position: relative;
    background: linear-gradient(180deg, #fdfaf4, #fbf2ec, #f7e7df);
    border-left: 1px solid rgba(201,162,94,.7); border-right: 1px solid rgba(201,162,94,.7);
    transition: height .85s cubic-bezier(.22,1,.36,1);
    box-shadow: 0 18px 36px -18px rgba(110,31,47,.3);
  }
  .parchment-inner {
    height: 316px; padding: 20px; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; opacity: 0; transition: opacity .55s ease;
  }
  .parchment-roller {
    width: 92%; height: 20px; border-radius: 99px;
    background: linear-gradient(180deg, #f4e5d8, #e2c6ad, #b98f5c);
    border: 1px solid rgba(201,162,94,.7); box-shadow: 0 8px 16px -4px rgba(76,18,30,.34);
  }
  .tassel-btn {
    border: 0; background: transparent; cursor: grab; touch-action: none;
    display: flex; flex-direction: column; align-items: center; padding: 0 20px 8px;
  }
  @keyframes tasselSw { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
  .tassel-anim { transform-origin: top center; animation: tasselSw 3.2s ease-in-out infinite; }
  @keyframes cueDown { 0% { transform: translateY(0); opacity: 0; } 25% { opacity: 1; } 80% { transform: translateY(20px); opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
  .cue-anim { animation: cueDown 2s ease-in-out infinite; }

  .countdown { margin-top: 28px; display: flex; align-items: baseline; justify-content: center; gap: 8px; color: var(--wine); font-variant-numeric: tabular-nums; }
  .btn-primary {
    margin-top: 18px; min-height: 44px; padding: 11px 24px; border-radius: 999px;
    border: 1px solid rgba(110,31,47,.8); background: var(--wine); color: #fdf7ee;
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 500;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-outline {
    min-height: 44px; padding: 11px 18px; border-radius: 999px;
    border: 1px solid rgba(110,31,47,.6); background: #fdf9f4; color: var(--wine);
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }

  /* 3D Carousels */
  .carousel-stage {
    position: relative; margin: 28px auto 0; height: 424px; max-width: 500px;
    display: flex; align-items: center; justify-content: center; perspective: 1100px;
    touch-action: pan-y; user-select: none; overflow: visible;
  }
  .fest-card, .story-card {
    position: absolute; border-radius: 24px; overflow: hidden;
    transition: transform .5s cubic-bezier(.22,1,.36,1), opacity .5s ease;
    will-change: transform, opacity;
  }
  .fest-card { width: 274px; height: 400px; border: 1px solid rgba(201,162,94,.8); }
  .story-card { width: 252px; height: 344px; padding: 8px; background: #fdfaf5; border: 1px solid rgba(201,162,94,.8); }
  .carousel-nav { margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .nav-arrow {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(201,162,94,.65);
    background: rgba(253,249,244,.85); color: var(--wine); font-size: 18px; cursor: pointer;
  }
  .dot-row { display: flex; gap: 7px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 99px; border: 0; background: rgba(201,162,94,.5); cursor: pointer; transition: width .3s ease, background .3s ease; }
  .dot.active { width: 24px; background: var(--wine); }

  /* Grand Reception */
  .reception-card {
    position: relative; max-width: 376px; margin: 0 auto; border-radius: 28px;
    border: 1px solid rgba(223,193,132,.75); padding: 44px 26px; overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(68,14,26,.52); color: #fdf6ea;
  }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.2) rotate(20deg); } }
  .sparkle { position: absolute; animation: twinkle 3.2s ease-in-out infinite; pointer-events: none; }

  /* Location Map */
  .map-card {
    display: block; max-width: 376px; margin: 26px auto 0; border-radius: 26px; overflow: hidden;
    border: 1px solid rgba(201,162,94,.75); background: #fdfaf5; text-decoration: none; color: inherit;
    box-shadow: 0 20px 44px -18px rgba(110,31,47,.24);
  }
  @keyframes drawPath { 0% { stroke-dashoffset: 320; } 70%,100% { stroke-dashoffset: 0; } }
  .route-path { stroke-dasharray: 320; animation: drawPath 4.2s ease-in-out infinite; }
  @keyframes pinHop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .pin-hop { animation: pinHop 2.4s ease-in-out infinite; }

  /* Floating Music Button */
  #music-fab {
    position: fixed; right: 16px; bottom: 18px; z-index: 45;
    min-height: 44px; padding: 0 16px; border-radius: 999px;
    border: 1px solid rgba(201,162,94,.75); background: rgba(110,31,47,.94); color: #fdf7ee;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500;
    display: none; align-items: center; gap: 8px; cursor: pointer; text-decoration: none;
    box-shadow: 0 12px 26px -8px rgba(76,18,30,.5);
  }
  #music-fab.visible { display: inline-flex; }

  /* Preserve animations even under reduced-motion as requested */
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: inherit !important; animation-iteration-count: inherit !important; transition-duration: inherit !important; }
  }
</style>
</head>
<body>
  <div id="book-overlay">
    <p id="book-mantra" class="font-bengali" style="position:relative;z-index:10;margin-bottom:20px;font-size:13px;letter-spacing:.18em;color:rgba(110,31,47,.8);"></p>
    <div class="book-stage">
      <button id="open-book-btn" class="book-btn" type="button" disabled>
        <div class="book-pages">
          <div style="width:100%;height:100%;border-radius:110px 110px 8px 8px;border:1px solid rgba(201,162,94,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;">
            <img id="page-ganesh" alt="" style="width:48px;height:48px;margin-bottom:10px;" />
            <div id="page-names" class="font-display" style="font-style:italic;font-size:18px;color:#6e1f2f;"></div>
          </div>
        </div>
        <div class="book-cover velvet-wine">
          <div class="book-frame"></div>
          <span id="cover-sub" style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(231,207,160,.85);"></span>
          <div style="display:flex;flex-direction:column;align-items:center;">
            <img id="cover-ganesh" alt="Ganesh ji" style="width:94px;height:94px;" />
            <div id="cover-bride" class="font-display font-bengali text-gold-foil" style="font-size:24px;margin-top:14px;"></div>
            <div id="cover-conj" class="font-display font-bengali" style="color:rgba(231,207,160,.9);font-size:16px;margin:2px 0;"></div>
            <div id="cover-groom" class="font-display font-bengali text-gold-foil" style="font-size:24px;"></div>
          </div>
          <div id="cover-date" style="font-size:11px;letter-spacing:.16em;color:rgba(243,223,180,.92);"></div>
        </div>
      </button>
    </div>
    <div id="loader-area" style="position:relative;z-index:30;margin-top:26px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div class="loader-track"><div id="loader-fill" class="loader-fill"></div></div>
      <span id="loader-text" style="margin-top:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(110,31,47,.75);"></span>
    </div>
  </div>

  <div id="marigold-bar" aria-hidden="true"></div>
  <div id="corner-roses" aria-hidden="true"></div>
  <canvas id="petal-canvas" aria-hidden="true"></canvas>

  <main>
    <section id="hero" style="padding:56px 20px 24px;">
      <div class="arch-card">
        <div class="arch-bg">
          <img id="hero-photo" alt="" />
          <div class="arch-wash"></div>
        </div>
        <div class="arch-inner"></div>
        <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;">
          <img id="hero-ganesh" alt="Ganesh ji" style="width:58px;height:58px;" />
          <p id="hero-together" style="margin-top:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7a4b3a;font-weight:500;"></p>
        </div>
        <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;">
          <span id="hero-bride-role" class="font-bengali" style="font-size:10px;letter-spacing:.14em;color:#8b6232;"></span>
          <h1 id="hero-bride" class="font-display font-bengali" style="font-size:32px;line-height:1.15;color:#6e1f2f;font-weight:600;margin-top:2px;"></h1>
          <p id="hero-bride-parents" class="font-bengali" style="margin-top:4px;font-size:11px;color:#5c363e;max-width:276px;line-height:1.45;"></p>
          <p id="hero-bride-addr" class="font-bengali" style="margin-top:2px;font-size:10.5px;color:#744b54;max-width:276px;line-height:1.4;"></p>
          <div style="margin:8px 0;display:flex;align-items:center;gap:12px;">
            <span style="width:32px;height:1px;background:linear-gradient(90deg,transparent,#c9a25e);"></span>
            <span id="hero-conj" class="font-display font-bengali" style="font-size:22px;color:#b5873e;"></span>
            <span style="width:32px;height:1px;background:linear-gradient(270deg,transparent,#c9a25e);"></span>
          </div>
          <span id="hero-groom-role" class="font-bengali" style="font-size:10px;letter-spacing:.14em;color:#8b6232;"></span>
          <h2 id="hero-groom" class="font-display font-bengali" style="font-size:32px;line-height:1.15;color:#6e1f2f;font-weight:600;margin-top:2px;"></h2>
          <p id="hero-groom-parents" class="font-bengali" style="margin-top:4px;font-size:11px;color:#5c363e;max-width:276px;line-height:1.45;"></p>
          <p id="hero-groom-addr" class="font-bengali" style="margin-top:2px;font-size:10.5px;color:#744b54;max-width:276px;line-height:1.4;"></p>
        </div>
        <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;">
          <p id="hero-invite" style="font-size:11.5px;color:#522d36;max-width:268px;line-height:1.55;"></p>
          <a href="#save-the-date" aria-label="Scroll down" style="margin-top:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#6e1f2f;text-decoration:none;">
            <span class="float-arrow" style="font-size:20px;">&#8964;</span>
          </a>
        </div>
      </div>
    </section>

    <section id="save-the-date">
      <div class="reveal">
        <p id="std-sub" class="kicker font-bengali"></p>
        <h2 id="std-title" class="sec-title font-display"></h2>
      </div>
      <div class="scroll-wrap">
        <div class="rod"><div class="rod-ball"></div><div class="rod-bar"></div><div class="rod-ball"></div></div>
        <div id="parchment" class="parchment">
          <div id="parchment-inner" class="parchment-inner">
            <div style="position:absolute;inset:12px;border:1px solid rgba(201,162,94,.65);pointer-events:none;"></div>
            <img id="scroll-ganesh" alt="Ganesh ji" style="width:48px;height:48px;margin-bottom:8px;" />
            <p id="scroll-kicker" class="font-bengali" style="font-size:11px;letter-spacing:.18em;color:#8b6232;"></p>
            <p id="scroll-date" class="font-display" style="margin-top:8px;font-size:24px;color:#6e1f2f;"></p>
            <div style="width:60px;height:1px;background:#c9a25e;margin:12px 0;"></div>
            <p id="scroll-time" style="font-size:12px;color:#653c45;"></p>
            <p id="scroll-venue" style="margin-top:6px;font-size:11px;color:#7a525b;max-width:220px;"></p>
          </div>
        </div>
        <div class="parchment-roller"></div>
        <button id="tassel-btn" class="tassel-btn" type="button">
          <div id="tassel-body" class="tassel-anim" style="display:flex;flex-direction:column;align-items:center;">
            <div style="width:2px;height:24px;background:linear-gradient(180deg,#b88c42,#e7cfa0);"></div>
            <div style="width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f2da9d,#9c7738);"></div>
            <div style="width:16px;height:36px;margin-top:-2px;border-radius:0 0 12px 12px;background:linear-gradient(180deg,#7d2234,#420c18);"></div>
          </div>
          <div id="pull-cue" style="margin-top:6px;display:flex;flex-direction:column;align-items:center;">
            <span class="cue-anim" style="font-size:18px;color:#6e1f2f;">&#8595;</span>

  $('copy-btn').addEventListener('click', () => {
    const txt = config.venueName + ', ' + config.venueAddress;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
    $('copy-btn').textContent = copy.addressCopied;
    setTimeout(() => { $('copy-btn').textContent = copy.copyAddress; }, 2200);
  });

  // Soft scroll reveals + pause off-screen animations
  const revObs = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) e.target.classList.add('vis');
      e.target.classList.toggle('anim-paused', !e.isIntersecting);
    });
  }, { threshold: .1 });
  document.querySelectorAll('.reveal, section').forEach((el) => revObs.observe(el));
})();
</script>
</body>
</html>
